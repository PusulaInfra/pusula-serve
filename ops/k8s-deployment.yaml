apiVersion: apps/v1
kind: Deployment
metadata:
  name: pusula-serve
  labels:
    app: pusula-serve
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pusula-serve
  template:
    metadata:
      labels:
        app: pusula-serve
    spec:
      containers:
      - name: engine
        image: pusula-infra/pusula-serve:latest
        args: ["--addr=:8080", "--model=llama-3.1-70b", "--seqs=16"]
        ports:
        - containerPort: 8080
          name: http
        resources:
          limits:
            nvidia.com/gpu: "4"
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
