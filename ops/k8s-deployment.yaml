apiVersion: apps/v1
kind: Deployment
metadata:
  name: pusula-serve
  namespace: default
  labels:
    app: pusulainfra
    environment: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pusulainfra
  template:
    metadata:
      labels:
        app: pusulainfra
    spec:
      containers:
      - name: pusula-serve
        image: pusulainfra/pusula-serve:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PORT
          value: "8080"
        - name: LOG_LEVEL
          value: "info"
        resources:
          limits:
            nvidia.com/gpu: "4"
            memory: "32Gi"
            cpu: "8"
          requests:
            nvidia.com/gpu: "4"
            memory: "16Gi"
            cpu: "4"
        readinessProbe:
          httpGet:
            path: /ops/status
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /ops/status
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: pusula-serve-svc
  namespace: default
  labels:
    app: pusulainfra
spec:
  type: LoadBalancer
  selector:
    app: pusulainfra
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
