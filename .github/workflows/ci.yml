name: Pusula-Serve CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install dependencies
        run: go mod download

      - name: Run Tests with Race Detector
        run: go test -v -race ./...

      - name: Run Engine Benchmarks
        run: go test -bench=. -benchmem ./engine

      - name: Build Project
        run: go build -v -o bin/pusula-serve cmd/main.go
